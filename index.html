<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="أثر شات - تواصل يترك أثرًا">
  <title>أثر شات | ATHAR CHAT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d7b56d;
      --gold-light: #f4dfa4;
      --black: #090909;
      --panel: #111111;
      --muted: #929292;
      --border: #302719;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #382b142c, transparent 55%),
        var(--black);
      color: #fff;
      font-family: "Tajawal", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ffffff0d;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      color: var(--gold-light);
    }

    .brand small {
      display: block;
      font-size: 10px;
      letter-spacing: 4px;
      color: #a99468;
      direction: ltr;
      text-align: right;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    main {
      flex: 1;
      width: min(100% - 30px, 440px);
      margin: 48px auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border: 1px solid var(--gold);
      border-radius: 24px;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-size: 38px;
      box-shadow: 0 0 45px #d7b56d12;
      transform: rotate(-3deg);
    }

    h1 {
      font-size: 34px;
      margin: 0 0 8px;
      color: var(--gold-light);
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }

    .card {
      background: linear-gradient(145deg, #151515, #0e0e0e);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px 22px;
      box-shadow: 0 20px 70px #0008;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      background: #080808;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .tab {
      border: 0;
      border-radius: 9px;
      padding: 12px 5px;
      background: transparent;
      color: #999;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    .tab.active {
      background: linear-gradient(135deg, #f0d99b, #b28b43);
      color: #15110a;
      font-weight: 800;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: #ddd1b6;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #34302a;
      background: #090909;
      color: white;
      outline: none;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #d7b56d12;
    }

    input::placeholder {
      color: #626262;
    }

    .forgot {
      display: block;
      margin-top: 12px;
      color: var(--gold);
      font-size: 13px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 23px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(110deg, #f0d99b, #b28b43);
      color: #171209;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .primary:disabled {
      opacity: .55;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 17px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .message.info {
      background: #d7b56d14;
      color: var(--gold-light);
      border: 1px solid #d7b56d30;
    }

    .message.error {
      background: #ff454510;
      color: #ffaaaa;
      border: 1px solid #ff454530;
    }

    .message.success {
      background: #39cf8510;
      color: #8ce7b5;
      border: 1px solid #39cf8530;
    }

    .terms {
      color: #777;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      margin: 20px 0 0;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #666;
      font-size: 12px;
      border-top: 1px solid #ffffff0b;
    }

    footer span {
      color: var(--gold);
    }

    @media (max-width: 420px) {
      main {
        margin: 32px auto;
      }

      .card {
        padding: 22px 17px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      أَثَر شات
      <small>ATHAR CHAT</small>
    </div>
    <div class="status">تواصل يترك أثرًا ✦</div>
  </header>

  <main>
    <section class="intro">
      <div class="logo">أ</div>
      <h1>أهلًا بك في أَثَر</h1>
      <p class="subtitle">مساحتك للتواصل ومشاركة اللحظات.</p>
    </section>

    <section class="card">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          تسجيل الدخول
        </button>
        <button class="tab" id="signupTab" type="button">
          إنشاء حساب
        </button>
      </div>

      <form id="authForm">
        <div id="nameGroup" hidden>
          <label for="displayName">الاسم الظاهر</label>
          <input
            id="displayName"
            type="text"
            maxlength="40"
            autocomplete="name"
            placeholder="كيف نناديك؟"
          >
        </div>

        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
        >

        <label for="password">كلمة المرور</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="current-password"
          placeholder="8 أحرف على الأقل"
          required
        >

        <a href="#" class="forgot" id="forgotPassword">
          نسيت كلمة المرور؟
        </a>

        <button class="primary" id="submitButton" type="submit">
          تسجيل الدخول
        </button>

        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>

      <p class="terms">
        بإنشاء حساب، فإنك توافق على الالتزام بقواعد المجتمع.
        حافظ على خصوصيتك ولا تشارك كلمة مرورك مع أحد.
      </p>
    </section>
  </main>

  <footer>
    © 2026 <span>ATHAR CHAT</span> — جميع الحقوق محفوظة
  </footer>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ضع بيانات مشروعك هنا قبل استخدام التسجيل.
    const SUPABASE_URL = "https://krblbawgcpthbiixauyu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "ضع_مفتاح_النشر_هنا";

    const configured =
      SUPABASE_PUBLISHABLE_KEY !== "ضع_مفتاح_النشر_هنا" &&
      SUPABASE_PUBLISHABLE_KEY.trim().length > 0;

    const supabase = configured
      ? createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const nameGroup = document.getElementById("nameGroup");
    const displayName = document.getElementById("displayName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const forgotPassword = document.getElementById("forgotPassword");
    const message = document.getElementById("message");

    let mode = "login";

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const signingUp = mode === "signup";

      loginTab.classList.toggle("active", !signingUp);
      signupTab.classList.toggle("active", signingUp);

      nameGroup.hidden = !signingUp;
      displayName.required = signingUp;

      password.autocomplete = signingUp
        ? "new-password"
        : "current-password";

      submitButton.textContent = signingUp
        ? "إنشاء حساب جديد"
        : "تسجيل الدخول";

      forgotPassword.style.display = signingUp ? "none" : "block";
      message.className = "message";
      message.textContent = "";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!configured) {
        showMessage(
          "بقي إعداد مفتاح النشر الخاص بمشروع Supabase. افتح إعدادات المشروع للحصول عليه، ثم ضعه في الكود.",
          "info"
        );
        return;
      }

      const emailValue = email.value.trim();
      const passwordValue = password.value;
      const origin = window.location.origin +
        window.location.pathname;

      submitButton.disabled = true;
      showMessage("جارٍ تنفيذ طلبك...", "info");

      try {
        let result;

        if (mode === "signup") {
          const name = displayName.value.trim();

          if (!name) {
            showMessage("اكتب الاسم الظاهر أولًا.", "error");
            return;
          }

          result = await supabase.auth.signUp({
            email: emailValue,
            password: passwordValue,
            options: {
              data: {
                display_name: name
              },
              emailRedirectTo: origin
            }
          });

          if (result.error) throw result.error;

          showMessage(
            "تم إرسال طلب إنشاء الحساب. إذا كان تأكيد البريد مفعّلًا، افتح رسالة Supabase في بريدك وأكمل التأكيد قبل تسجيل الدخول.",
            "success"
          );
        } else {
          result = await supabase.auth.signInWithPassword({
            email: emailValue,
            password: passwordValue
          });

          if (result.error) throw result.error;

          showMessage("تم تسجيل الدخول بنجاح!", "success");

          // سنضيف الصفحة الرئيسية للمستخدم بعد تجهيزها.
        }
      } catch (error) {
        showMessage(
          error.message || "تعذر إكمال الطلب. حاول مرة أخرى.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
      }
    });

    forgotPassword.addEventListener("click", async (event) =>
