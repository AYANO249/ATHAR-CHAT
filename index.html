<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>أَثَر شات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090909;
  --card:#14130f;
  --card2:#211e17;
  --gold:#d9b65e;
  --gold2:#f3dda0;
  --text:#f7f3e8;
  --muted:#a29d8d;
  --border:#393326;
  --green:#4bdb9c;
  --red:#ff7777;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#211a0c,var(--bg) 60%);
  color:var(--text);
  font-family:Tajawal,sans-serif;
  min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.gold{color:var(--gold2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--gold);
}
.app{max-width:1200px;margin:auto;padding:15px}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:15px
}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800}
.logo{
  width:45px;height:45px;display:grid;place-items:center;
  border-radius:14px;background:linear-gradient(135deg,var(--gold2),#997326);
  color:#111;font-size:25px
}
.actions{display:flex;gap:7px}
.btn{
  border:0;border-radius:12px;padding:11px 15px;
  background:var(--gold);color:#151209;font-weight:800
}
.btn.secondary{
  background:var(--card2);color:var(--text);
  border:1px solid var(--border)
}
.btn.danger{background:#351919;color:#ffc5c5}
.wide{width:100%;margin-top:9px}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:20px
}
.auth{max-width:430px;margin:7vh auto}
.tabs{display:flex;gap:5px;padding:4px;background:#080808;border-radius:12px;margin:18px 0}
.tabs button{
  flex:1;padding:11px;border:0;border-radius:9px;
  background:transparent;color:var(--muted)
}
.tabs button.active{background:#302715;color:var(--gold2)}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}
.field label{font-size:13px;color:var(--gold2)}
.field input,.field textarea,.search{
  width:100%;border:1px solid var(--border);border-radius:12px;
  padding:12px;background:#090909;color:var(--text)
}
.field textarea{min-height:80px;resize:vertical}
.layout{
  display:grid;grid-template-columns:310px minmax(0,1fr);
  gap:14px;min-height:70vh
}
.sidebar,.chat{
  min-width:0;overflow:hidden;background:#10100fee;
  border:1px solid var(--border);border-radius:18px
}
.sidehead{padding:14px;border-bottom:1px solid var(--border)}
.myprofile{display:flex;align-items:center;gap:10px}
.avatar{
  width:45px;height:45px;flex-shrink:0;overflow:hidden;
  display:grid;place-items:center;border:1px solid #6a572d;
  border-radius:50%;background:#302819;color:var(--gold2);font-weight:800
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profiletext,.userinfo{flex:1;min-width:0}
.profiletext strong,.profiletext span,.userinfo strong,.userinfo span{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.profiletext span,.userinfo span{font-size:12px;color:var(--muted);margin-top:4px}
.icon{
  min-width:40px;height:40px;border:1px solid #423821;
  border-radius:11px;background:#252116;color:var(--gold2)
}
.search{margin-top:12px}
.sectiontitle{padding:13px 15px 5px;color:var(--gold2);font-weight:800}
.userlist{max-height:55vh;overflow:auto;padding:6px}
.user{
  display:flex;align-items:center;gap:10px;padding:10px;
  margin-bottom:3px;border:1px solid transparent;border-radius:13px;
  cursor:pointer
}
.user:hover,.user.active{background:#282113;border-color:#44371c}
.user .avatar{width:42px;height:42px}
.dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#777;margin-left:5px
}
.dot.online{background:var(--green);box-shadow:0 0 7px #4bdb9c80}
.chathead{
  display:flex;align-items:center;gap:10px;min-height:72px;
  padding:12px 15px;border-bottom:1px solid var(--border)
}
.chathead .avatar{width:42px;height:42px}
.chatheadtext{flex:1;min-width:0}
.chatheadtext strong,.chatheadtext span{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.chatheadtext span{font-size:12px;color:var(--muted);margin-top:5px}
.messages{
  display:flex;flex-direction:column;gap:10px;
  height:calc(70vh - 170px);min-height:300px;overflow-y:auto;
  padding:15px;background:#0b0b0bf5
}
.empty{margin:auto;padding:20px;text-align:center;color:var(--muted);line-height:2}
.bubble{
  position:relative;align-self:flex-start;max-width:min(85%,500px);
  overflow-wrap:anywhere;padding:10px 12px;
  border:1px solid #343025;border-radius:15px 15px 15px 4px;
  background:#201f19
}
.bubble.mine{
  align-self:flex-end;border-color:#685329;
  border-radius:15px 15px 4px 15px;background:#382c16
}
.bubble.selected{outline:2px solid var(--gold);box-shadow:0 0 14px #d9b65e35}
.bubble img.media-image{display:block;max-width:100%;max-height:330px;border-radius:10px}
.bubble img.sticker{display:block;width:150px;max-width:100%;border-radius:8px}
.bubble audio{display:block;width:min(260px,65vw);max-width:100%;margin-top:5px}
.bubbletime{text-align:left;margin-top:5px;color:#bcb18e;font-size:10px}
.message-toolbar{
  position:relative;z-index:5;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:7px;padding:10px;
  background:#17150ff5;border-bottom:1px solid #51452b
}
.toolbar-reactions{display:flex;gap:5px;flex-wrap:wrap}
.toolbar-reactions button,.toolbar-delete,.toolbar-close{
  border:1px solid #51452b;border-radius:10px;padding:8px 10px;
  background:#242116;color:var(--gold2);font-size:17px
}
.toolbar-delete{background:#351919;color:#ffc5c5;font-size:14px}
.toolbar-close{font-size:14px}
.reaction-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.reaction-chip{
  border:1px solid #65522e;border-radius:20px;padding:3px 8px;
  background:#19170f;color:var(--text);font-size:13px
}
.typing{min-height:22px;padding:2px 15px;color:var(--gold2);font-size:12px}
.composer{
  display:flex;align-items:flex-end;gap:7px;padding:11px;
  border-top:1px solid var(--border)
}
.composer textarea{
  flex:1;min-width:0;min-height:43px;max-height:120px;resize:none;
  border:1px solid #403723;border-radius:12px;padding:11px;
  background:#090909;color:var(--text)
}
.composer .btn,.composer .icon{height:43px}
.composer .icon{min-width:40px}
.modal{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding:15px;background:#000c
}
.modalbox{
  width:min(100%,470px);max-height:90vh;overflow:auto;padding:20px;
  border:1px solid #57482a;border-radius:19px;background:#121210
}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.notice{
  position:fixed;z-index:40;bottom:18px;left:50%;transform:translateX(-50%);
  width:max-content;max-width:90%;padding:12px 17px;
  border:1px solid #67532b;border-radius:12px;background:#242116
}
footer{text-align:center;padding:22px 0 7px;color:#777366;font-size:12px}
.mobileback{display:none}
@media(max-width:760px){
  .app{padding:9px}
  .brand{font-size:19px}
  header{align-items:flex-start}
  .actions{flex-direction:column}
  .actions .btn{padding:8px;font-size:12px}
  .layout{display:block}
  .sidebar{margin-bottom:10px}
  .userlist{max-height:210px}
  .chat{min-height:55vh}
  .messages{height:48vh;min-height:250px}
  .chat.notselected .chathead,.chat.notselected .messages,
  .chat.notselected .typing,.chat.notselected .composer,
  .chat.notselected .message-toolbar{display:none}
  .chat.notselected:after{
    content:'اختر شخصًا من القائمة لبدء المحادثة';
    display:block;padding:25px 10px;text-align:center;color:var(--muted)
  }
  .mobileback{display:block}
  .bubble{max-width:90%}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">أ</div>
    <div>أَثَر شات<div class="small muted">مساحة للتواصل</div></div>
  </div>
  <div class="actions hidden" id="topActions">
    <button class="btn secondary" id="editTop">ملفي الشخصي</button>
    <button class="btn danger" id="logout">خروج</button>
  </div>
</header>

<section class="auth card" id="authView">
  <h2 id="authTitle">أهلًا بعودتك</h2>
  <p class="muted" id="authSubtitle">سجّل الدخول لمتابعة محادثاتك.</p>

  <div class="tabs">
    <button class="active" id="loginTab">تسجيل الدخول</button>
    <button id="signupTab">إنشاء حساب</button>
  </div>

  <form id="authForm">
    <div class="field hidden" id="usernameField">
      <label for="username">اسم المستخدم</label>
      <input id="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}">
    </div>

    <div class="field hidden" id="displayField">
      <label for="displayName">الاسم الظاهر</label>
      <input id="displayName" maxlength="40">
    </div>

    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required minlength="6">
    </div>

    <button class="btn wide" id="authSubmit">دخول</button>
  </form>

  <button class="btn secondary wide" id="forgot">نسيت كلمة المرور؟</button>
  <p class="small muted">لا تشارك كلمة مرورك مع أي شخص.</p>
</section>

<main class="layout hidden" id="mainView">
  <aside class="sidebar">
    <div class="sidehead">
      <div class="myprofile">
        <div class="avatar" id="myAvatar">أ</div>
        <div class="profiletext">
          <strong id="myName">حسابي</strong>
          <span id="myUsername">@username</span>
        </div>
        <button class="icon" id="editProfile">✎</button>
      </div>
      <input class="search" id="searchUsers" placeholder="ابحث باسم المستخدم...">
    </div>

    <div class="sectiontitle">الأشخاص والمحادثات</div>
    <div class="userlist" id="userList">
      <div class="empty">جارٍ التحميل...</div>
    </div>
  </aside>

  <section class="chat notselected" id="chatPanel">
    <div class="chathead" id="chatHead">
      <div class="avatar">أ</div>
      <div class="chatheadtext">
        <strong>أَثَر شات</strong>
        <span>اختر شخصًا من القائمة</span>
      </div>
    </div>

    <div id="messageToolbar" class="message-toolbar hidden">
      <span id="selectedCount" class="gold">تم تحديد رسالة</span>
      <div class="toolbar-reactions">
        <button data-emoji="❤️">❤️</button>
        <button data-emoji="😂">😂</button>
        <button data-emoji="👍">👍</button>
        <button data-emoji="😮">😮</button>
        <button data-emoji="😢">😢</button>
        <button data-emoji="🔥">🔥</button>
      </div>
      <button id="toolbarDelete" class="toolbar-delete">🗑️ حذف</button>
      <button id="toolbarClose" class="toolbar-close">✕</button>
    </div>

    <div class="messages" id="messages">
      <div class="empty">💬<br>اختر شخصًا لبدء محادثة خاصة.</div>
    </div>

    <div class="typing" id="typingLine"></div>

    <form class="composer" id="messageForm">
      <input type="file" id="imageInput" accept="image/*" class="hidden">
      <input type="file" id="stickerInput" accept="image/*" class="hidden">

      <button type="button" class="icon" id="attach" title="إرسال صورة">▧</button>
      <button type="button" class="icon" id="makeSticker" title="صنع ملصق">✂</button>
      <button type="button" class="icon" id="recordVoice" title="تسجيل رسالة صوتية">🎙</button>

      <textarea id="messageInput" rows="1" maxlength="2000"
        placeholder="اكتب رسالتك..." disabled></textarea>

      <button class="btn" id="send" type="submit" disabled>إرسال</button>
    </form>
  </section>
</main>

<footer>أَثَر شات · تواصل باحترام واحفظ خصوصيتك.</footer>
</div>

<div class="modal hidden" id="profileModal">
  <div class="modalbox">
    <div class="modalhead">
      <h2>ملفي الشخصي</h2>
      <button class="icon" id="closeProfile">✕</button>
    </div>

    <div class="field">
      <label for="profileName">الاسم الظاهر</label>
      <input id="profileName" maxlength="40">
    </div>

    <div class="field">
      <label for="profileBio">نبذة عنك</label>
      <textarea id="profileBio" maxlength="180"></textarea>
    </div>

    <div class="field">
      <label for="avatarInput">صورة الملف الشخصي</label>
      <input type="file" id="avatarInput" accept="image/*">
    </div>

    <button class="btn wide" id="saveProfile">حفظ التعديلات</button>
  </div>
</div>

<div class="notice hidden" id="notice"></div>

<script>
(() => {
'use strict';

/* إعدادات مشروع Supabase */
const SUPABASE_URL = 'https://krblbawgcpthbiixauyu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MgcstiMSIONj8Tc4AJl1SA_q7QnzlUX';
const BUCKET = 'athar-chat-media';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let user = null;
let profile = null;
let people = [];
let active = null;
let messages = [];
let reactions = [];
let selectedMessageId = null;
let signup = false;
let chosenAvatar = null;
let recording = null;
let audioParts = [];
let realtime = null;
let presence = null;
let typingChannel = null;
let typingTimer = null;
let noticeTimer = null;
let online = new Set();

function toast(message) {
  $('notice').textContent = message;
  $('notice').classList.remove('hidden');
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => $('notice').classList.add('hidden'), 3500);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function initial(p) {
  return esc((p?.display_name || p?.username || 'أ').trim().slice(0,1));
}

function avatarHTML(p) {
  return `<div class="avatar">${p?.avatar_url
    ? `<img src="${esc(p.avatar_url)}" alt="">`
    : initial(p)}</div>`;
}

function timeText(value) {
  try {
    return new Intl.DateTimeFormat('ar',{
      hour:'2-digit',minute:'2-digit'
    }).format(new Date(value));
  } catch { return ''; }
}

function errorText(error) {
  const m = error?.message || 'حدث خطأ غير معروف.';
  if (/Invalid login credentials/i.test(m)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if (/Email not confirmed/i.test(m)) return 'أكّد بريدك الإلكتروني أولًا.';
  if (/duplicate key|unique constraint/i.test(m)) return 'اسم المستخدم مستخدم بالفعل.';
  if (/Failed to fetch/i.test(m)) return 'تعذّر الاتصال بالإنترنت.';
  return m;
}

function showAuth() {
  $('authView').classList.remove('hidden');
  $('mainView').classList.add('hidden');
  $('topActions').classList.add('hidden');
}

function showMain() {
  $('authView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  $('topActions').classList.remove('hidden');
}

function authMode(isSignup) {
  signup = isSignup;
  $('loginTab').classList.toggle('active',!signup);
  $('signupTab').classList.toggle('active',signup);
  $('usernameField').classList.toggle('hidden',!signup);
  $('displayField').classList.toggle('hidden',!signup);
  $('username').required = signup;
  $('displayName').required = signup;
  $('authTitle').textContent = signup ? 'إنشاء حساب جديد' : 'أهلًا بعودتك';
  $('authSubtitle').textContent = signup ? 'اختر اسم مستخدم مميزًا.' : 'سجّل الدخول لمتابعة محادثاتك.';
  $('authSubmit').textContent = signup ? 'إنشاء الحساب' : 'دخول';
}

$('loginTab').onclick = () => authMode(false);
$('signupTab').onclick = () => authMode(true);

$('forgot').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return toast('اكتب بريدك الإلكتروني أولًا.');
  const {error} = await db.auth.resetPasswordForEmail(email,{
    redirectTo:location.origin + location.pathname
  });
  toast(error ? errorText(error) : 'إذا كان البريد مسجلًا، ستصلك رسالة استعادة.');
};

$('authForm').onsubmit = async e => {
  e.preventDefault();
  $('authSubmit').disabled = true;

  try {
    const email = $('email').value.trim();
    const password = $('password').value;

    if (signup) {
      const username = $('username').value.trim().toLowerCase();
      const display_name = $('displayName').value.trim();

      if (!/^[a-z0-9_]{3,20}$/.test(username))
        throw new Error('اسم المستخدم يجب أن يكون 3–20 حرفًا إنجليزيًا أو رقمًا أو _.');

      const {data,error} = await db.auth.signUp({
        email,password,
        options:{data:{username,display_name}}
      });
      if (error) throw error;

      if (data.session) {
        user = data.user;
        await startApp();
      } else {
        toast('تم إنشاء الحساب. أكّد بريدك الإلكتروني ثم سجّل الدخول.');
      }
    } else {
      const {data,error} = await db.auth.signInWithPassword({email,password});
      if (error) throw error;
      user = data.user;
      await startApp();
    }
  } catch(e) {
    toast(errorText(e));
  } finally {
    $('authSubmit').disabled = false;
  }
};

async function loadMyProfile() {
  const {data,error} = await db.from('profiles')
    .select('*').eq('user_id',user.id).maybeSingle();

  if (error) throw error;
  if (data) {
    profile = data;
    return;
  }

  const meta = user.user_metadata || {};
  let username = String(meta.username || user.email?.split('@')[0] || 'user')
    .toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20);

  if (username.length < 3) username = 'user' + user.id.slice(0,8);

  const {data:created,error:createError} = await db.from('profiles')
    .insert({
      user_id:user.id,
      username,
      display_name:meta.display_name || username,
      bio:''
    }).select().single();

  if (createError) throw createError;
  profile = created;
}

async function startApp() {
  try {
    if (!user) return showAuth();

    await loadMyProfile();
    showMain();
    renderMyProfile();
    await loadPeople();
    await startRealtime();
    await updateLastSeen();
  } catch(e) {
    console.error(e);
    toast('تعذّر تحميل الحساب: ' + errorText(e));
  }
}

function renderMyProfile() {
  $('myAvatar').innerHTML = profile.avatar_url
    ? `<img src="${esc(profile.avatar_url)}" alt="">`
    : initial(profile);
  $('myName').textContent = profile.display_name || profile.username;
  $('myUsername').textContent = '@' + profile.username;
}

async function loadPeople() {
  const {data,error} = await db.from('profiles')
    .select('user_id,username,display_name,avatar_url,bio,last_seen')
    .neq('user_id',user.id)
    .order('display_name',{ascending:true})
    .limit(500);

  if (error) throw error;
  people = data || [];
  renderPeople();
}

function lastMessage(id) {
  return messages.filter(m =>
    (m.sender_id === id && m.recipient_id === user.id) ||
    (m.sender_id === user.id && m.recipient_id === id)
  ).sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
}

function renderPeople() {
  const q = $('searchUsers').value.trim().replace(/^@/,'').toLowerCase();
  const list = people.filter(p =>
    !q || (p.username || '').toLowerCase().includes(q) ||
    (p.display_name || '').toLowerCase().includes(q)
  );

  list.sort((a,b) => {
    const ma = lastMessage(a.user_id);
    const mb = lastMessage(b.user_id);
    if (ma && mb) return new Date(mb.created_at)-new Date(ma.created_at);
    if (ma) return -1;
    if (mb) return 1;
    return 0;
  });

  $('userList').innerHTML = list.length ? list.map(p => {
    const m = lastMessage(p.user_id);
    const preview = m
      ? (m.image_url ? '📷 صورة' : (m.body || ''))
      : '@' + p.username;

    return `<div class="user ${active?.user_id === p.user_id ? 'active' : ''}"
      data-id="${esc(p.user_id)}">
      ${avatarHTML(p)}
      <div class="userinfo">
        <strong>${esc(p.display_name || p.username)}</strong>
        <span>${esc(preview)}</span>
      </div>
      ${m ? `<span class="small muted">${timeText(m.created_at)}</span>` : ''}
    </div>`;
  }).join('') : '<div class="empty">لا يوجد مستخدمون مطابقون.</div>';

  $('userList').querySelectorAll('.user').forEach(el => {
    el.onclick = () => openChat(el.dataset.id);
  });
}

$('searchUsers').oninput = renderPeople;

function renderChatHead() {
  if (!active) return;

  $('chatHead').innerHTML = `
    ${avatarHTML(active)}
    <div class="chatheadtext">
      <strong>${esc(active.display_name || active.username)}</strong>
      <span>@${esc(active.username)}</span>
    </div>
    <button class="icon mobileback" id="backUsers">☰</button>`;

  $('backUsers').onclick = () => {
    if (innerWidth <= 760) {
      active = null;
      closeMessageToolbar();
      stopTypingChannel();
      $('chatPanel').classList.add('notselected');
    }
  };
}

async function openChat(id) {
  active = people.find(p => p.user_id === id);
  if (!active) return;

  closeMessageToolbar();
  $('chatPanel').classList.remove('notselected');
  renderPeople();
  renderChatHead();
  $('messageInput').disabled = false;
  $('send').disabled = false;

  await loadMessages();
  await loadReactions();
  await startTypingChannel();
}

async function loadMessages() {
  if (!active) return;

  const other = active.user_id;
  const filter = `or(and(sender_id.eq.${user.id},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${user.id}))`;

  const {data,error} = await db.from('messages')
    .select('id,sender_id,recipient_id,body,image_url,created_at')
    .or(filter).order('created_at',{ascending:true}).limit(300);

  if (error) {
    console.error(error);
    toast('تعذّر تحميل الرسائل. راجع قاعدة البيانات.');
    return;
  }

  messages = messages.filter(m =>
    !((m.sender_id === other && m.recipient_id === user.id) ||
      (m.sender_id === user.id && m.recipient_id === other))
  ).concat(data || []);

  renderMessages();
  renderPeople();
}

function mediaHTML(m) {
  if (!m.image_url) return '';

  const url = esc(m.image_url);
  if (m.body === '🎙️ رسالة صوتية') {
    return `<audio controls preload="metadata" src="${url}"></audio>`;
  }
  if (m.body === '🧩 ملصق') {
    return `<a href="${url}" target="_blank" rel="noopener"><img class="sticker" src="${url}" alt="ملصق"></a>`;
  }
  return `<a href="${url}" target="_blank" rel="noopener"><img class="media-image" src="${url}" alt="صورة" loading="lazy"></a>`;
}

function reactionHTML(messageId) {
  const rows = reactions.filter(r => String(r.message_id) === String(messageId));
  const counts = {};

  rows.forEach(r => {
    counts[r.emoji] = (counts[r.emoji] || 0) + 1;
  });

  return `<div class="reaction-list">${
    Object.entries(counts).map(([emoji,count]) =>
      `<button class="reaction-chip" data-react="${esc(messageId)}" data-emoji="${esc(emoji)}">${esc(emoji)} ${count}</button>`
    ).join('')
  }</div>`;
}

function renderMessages() {
  const box = $('messages');

  if (!active) {
    box.innerHTML = '<div class="empty">اختر شخصًا لبدء المحادثة.</div>';
    return;
  }

  const rows = messages.filter(m =>
    (m.sender_id === user.id && m.recipient_id === active.user_id) ||
    (m.sender_id === active.user_id && m.recipient_id === user.id)
  ).sort((a,b) => new Date(a.created_at)-new Date(b.created_at));

  if (!rows.length) {
    box.innerHTML = '<div class="empty">💬<br>لا توجد رسائل بعد. ابدأ المحادثة!</div>';
    return;
  }

  box.innerHTML = rows.map(m => `
    <div class="bubble ${m.sender_id === user.id ? 'mine' : ''}"
      data-message="${esc(m.id)}">
      ${mediaHTML(m)}
      ${m.body && !['📷 صورة','🎙️ رسالة صوتية','🧩 ملصق'].includes(m.body)
        ? `<div>${esc(m.body).replace(/\n/g,'<br>')}</div>` : ''}
      <div class="bubbletime">${timeText(m.created_at)}</div>
      ${reactionHTML(m.id)}
    </div>
  `).join('');

  box.querySelectorAll('.bubble').forEach(bubble => {
    let timer;
    let longPressed = false;

    bubble.addEventListener('touchstart', () => {
      longPressed = false;
      timer = setTimeout(() => {
        longPressed = true;
        selectMessage(bubble.dataset.message);
      },500);
    },{passive:true});

    ['touchend','touchmove','touchcancel'].forEach(type => {
      bubble.addEventListener(type,() => clearTimeout(timer),{passive:true});
    });

    bubble.addEventListener('contextmenu',e => {
      e.preventDefault();
      selectMessage(bubble.dataset.message);
    });

    bubble.addEventListener('click',e => {
      if (longPressed) {
        e.preventDefault();
        e.stopPropagation();
        longPressed = false;
      }
    });
  });

  box.querySelectorAll('[data-react]').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      await toggleReaction(btn.dataset.react,btn.dataset.emoji);
    };
  });

  box.scrollTop = box.scrollHeight;
}

async function sendMessage(body,image_url=null) {
  if (!active) throw new Error('اختر محادثة أولًا.');

  const {data,error} = await db.from('messages').insert({
    sender_id:user.id,
    recipient_id:active.user_id,
    body:body || '',
    image_url
  }).select('id,sender_id,recipient_id,body,image_url,created_at').single();

  if (error) throw error;

  if (!messages.some(m => String(m.id) === String(data.id))) {
    messages.push(data);
  }

  renderMessages();
  renderPeople();
}

$('messageForm').onsubmit = async e => {
  e.preventDefault();
  const body = $('messageInput').value.trim();
  if (!body || !active) return;

  $('send').disabled = true;
  try {

$('messageInput').oninput = () => {
  const input = $('messageInput');
  input.style.height = 'auto';

  sendTyping(true);

function validImage(file) {
  if (!file || !file.type.startsWith('image/')) {
    toast('اختر ملف صورة صالحًا.');
    return false;
  }
  if (file.size > 5*1024*1024) {
    toast('حجم الصورة يجب ألا يتجاوز 5 ميغابايت.');
    return false;
  }
  return true;
}

async function uploadFile(file,folder) {
  const ext = (file.name.split('.').pop() || 'bin')
    .toLowerCase().replace(/[^a-z0-9]/g,'') || 'bin';

  const path = `${user.id}/${folder}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

  const {error} = await db.storage.from(BUCKET).upload(path,file,{
    contentType:file.type || 'application/octet-stream',
    cacheControl:'3600',
    upsert:false
  });

  if (error) throw error;

  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

/* إرسال الصور */
$('attach').onclick = () => {
  if (!active) return toast('اختر شخصًا أولًا.');
  $('imageInput').click();
};

$('imageInput').onchange = async e => {
  const file = e.target.files?.[0];
  e.target.value = '';

  $('attach').disabled = true;

    toast('تم إرسال الصورة.');

/* إنشاء ملصق من صورة */
$('makeSticker').onclick = () => {
  if (!active) return toast('اختر محادثة أولًا.');
  $('stickerInput').click();
};

$('stickerInput').onchange = async e => {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!validImage(file) || !active) return;

  try {
    toast('جارٍ تجهيز الملصق...');
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();

    img.onload = async () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,512,512);

        const scale = Math.min(512/img.width,512/img.height);
        const w = img.width*scale;
        const h = img.height*scale;

        ctx.drawImage(img,(512-w)/2,(512-h)/2,w,h);

        canvas.toBlob(async blob => {
          try {
            if (!blob) throw new Error('تعذّر إنشاء الملصق.');

            const stickerFile = new File(
              [blob],
              `sticker-${Date.now()}.webp`,
              {type:'image/webp'}
            );

            const url = await uploadFile(stickerFile,'sticker');
            await sendMessage('🧩 ملصق',url);
            toast('تم إرسال الملصق.');
          } catch(err) {
            toast(errorText(err));
          } finally {
            URL.revokeObjectURL(objectUrl);
          }
        },'image/webp',0.9);
      } catch(err) {
        URL.revokeObjectURL(objectUrl);
        toast(errorText(err));
      }
    };

    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      toast('تعذّر فتح الصورة.');
    };

    img.src = objectUrl;
  } catch(err) {
    toast(errorText(err));
  }
};

/* تسجيل الرسائل الصوتية */
$('recordVoice').onclick = async () => {
  if (!active) return toast('اختر محادثة أولًا.');

  if (recording && recording.state === 'recording') {
    recording.stop();
    $('recordVoice').textContent = '🎙';
    toast('جارٍ تجهيز الرسالة الصوتية...');
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    return toast('المتصفح لا يدعم تسجيل الصوت.');
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioParts = [];

    recording = new MediaRecorder(stream);
    recording.ondataavailable = e => {
      if (e.data.size) audioParts.push(e.data);
    };

    recording.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());

      try {
        const type = recording.mimeType || 'audio/webm';
        const blob = new Blob(audioParts,{type});
        const ext = type.includes('mp4') ? 'm4a' : 'webm';
        const file = new File([blob],`voice-${Date.now()}.${ext}`,{type});

        if (blob.size > 10*1024*1024) {
          throw new Error('الرسالة الصوتية كبيرة جدًا.');
        }

        const url = await uploadFile(file,'voice');
        await sendMessage('🎙️ رسالة صوتية',url);
        toast('تم إرسال الرسالة الصوتية.');
      } catch(err) {
        toast(errorText(err));
      }
    };

    recording.start();
    $('recordVoice').textContent = '⏹';
    toast('التسجيل يعمل. اضغط الزر مرة أخرى للإرسال.');
  } catch(err) {
    toast('تعذّر الوصول إلى الميكروفون. تحقق من إذن المتصفح.');
  }
};

/* التفاعلات */
async function loadReactions() {
  if (!active) return;

  const ids = messages
    .filter(m =>
      (m.sender_id === user.id && m.recipient_id === active.user_id) ||
      (m.sender_id === active.user_id && m.recipient_id === user.id)
    ).map(m => String(m.id));

  if (!ids.length) {
    reactions = [];
    renderMessages();
    return;
  }

  const {data,error} = await db.from('message_reactions')
    .select('message_id,user_id,emoji')
    .in('message_id',ids);

  if (error) {
    console.warn('تعذّر تحميل التفاعلات:',error.message);
    reactions = [];
  } else {
    reactions = data || [];
  }

  renderMessages();
}

async function toggleReaction(messageId,emoji) {
  if (!user) return;

  try {
    const exists = reactions.find(r =>
      String(r.message_id) === String(messageId) &&
      r.user_id === user.id &&
      r.emoji === emoji
    );

    if (exists) {
      const {error} = await db.from('message_reactions').delete()
        .eq('message_id',String(messageId))
        .eq('user_id',user.id)
        .eq('emoji',emoji);

      if (error) throw error;
      reactions = reactions.filter(r => !(
        String(r.message_id) === String(messageId) &&
        r.user_id === user.id && r.emoji === emoji
      ));
    } else {
      const {error} = await db.from('message_reactions').insert({
        message_id:String(messageId),
        user_id:user.id,
        emoji
      });

      if (error) throw error;
      reactions.push({message_id:String(messageId),user_id:user.id,emoji});
    }

    renderMessages();
  } catch(e) {
    toast('تعذّر حفظ التفاعل. تأكد من إعداد جدول التفاعلات.');
  }
}

function selectMessage(id) {
  selectedMessageId = String(id);

  document.querySelectorAll('.bubble.selected')
    .forEach(el => el.classList.remove('selected'));

  const bubble = document.querySelector(
    `.bubble[data-message="${CSS.escape(selectedMessageId)}"]`
  );

  if (!bubble) return;

  bubble.classList.add('selected');
  $('messageToolbar').classList.remove('hidden');

  const message = messages.find(m => String(m.id) === selectedMessageId);
  $('toolbarDelete').classList.toggle(
    'hidden',
    !message || message.sender_id !== user.id
  );
}

function closeMessageToolbar() {
  selectedMessageId = null;
  document.querySelectorAll('.bubble.selected')
    .forEach(el => el.classList.remove('selected'));
  $('messageToolbar').classList.add('hidden');
}

$('toolbarClose').onclick = closeMessageToolbar;

document.querySelectorAll('[data-emoji]').forEach(button => {
  button.onclick = async () => {
    if (!selectedMessageId) return;
    const id = selectedMessageId;
    await toggleReaction(id,button.dataset.emoji);
    closeMessageToolbar();
  };
});

$('toolbarDelete').onclick = async () => {
  if (!selectedMessageId) return;

  const id = selectedMessageId;
  const message = messages.find(m => String(m.id) === id);

  if (!message || message.sender_id !== user.id) {
    return toast('يمكنك حذف رسائلك فقط.');
  }

  if (!confirm('هل تريد حذف الرسالة نهائيًا؟')) return;

  try {
    const {error} = await db.from('messages').delete().eq('id',id);
    if (error) throw error;

    messages = messages.filter(m => String(m.id) !== id);
    reactions = reactions.filter(r => String(r.message_id) !== id);

    closeMessageToolbar();
    renderMessages();
    renderPeople();
    toast('تم حذف الرسالة.');
  } catch(e) {
    toast('تعذّر الحذف. تحقق من صلاحيات قاعدة البيانات.');
  }
};

/* الملف الشخصي */
function openProfile() {
  if (!profile) return;
  $('profileName').value = profile.display_name || '';
  $('profileBio').value = profile.bio || '';
  $('avatarInput').value = '';
  chosenAvatar = null;
  $('profileModal').classList.remove('hidden');
}

$('editProfile').onclick = openProfile;
$('editTop').onclick = openProfile;
$('closeProfile').onclick = () => $('profileModal').classList.add('hidden');
$('profileModal').onclick = e => {
  if (e.target === $('profileModal')) $('profileModal').classList.add('hidden');
};

$('avatarInput').onchange = e => {
  const file = e.target.files?.[0];
  if (file && validImage(file)) chosenAvatar = file;

$('saveProfile').onclick = async () => {
  const button = $('saveProfile');
  button.disabled = true;

  try {
    const display_name = $('profileName').value.trim();
    const bio = $('profileBio').value.trim();
    if (!display_name) throw new Error('اكتب الاسم الظاهر.');

    const patch = {display_name,bio,last_seen:new Date().toISOString()};

      .update(patch).eq('user_id',user.id);

    profile = {...profile,...patch};
    $('profileModal').classList.add('hidden');
    renderMyProfile();
    await loadPeople();
    if (active) {
      active = people.find(p => p.user_id === active.user_id) || active;
      renderChatHead();

    toast('تم حفظ الملف الشخصي.');
  } catch(e) {
    toast(errorText(e));
  } finally {
    button.disabled = false;
  }
};

async function updateLastSeen() {
  if (!user) return;

  const stamp = new Date().toISOString();
  const {error} = await db.from('profiles')
    .update({last_seen:stamp}).eq('user_id',user.id);

  if (!error && profile) profile.last_seen = stamp;
}

/* الرسائل الفورية */
async function startRealtime() {
  if (presence) db.removeChannel(presence);
  if (realtime) db.removeChannel(realtime);

  presence = db.channel('athar-presence',{
    config:{presence:{key:user.id}}
  });

  presence.on('presence',{event:'sync'},() => {
    online = new Set(Object.keys(presence.presenceState()));
    renderPeople();
  });

  presence.subscribe(async status => {
    if (status === 'SUBSCRIBED') {
      await presence.track({
        user_id:user.id,
        username:profile.username,
        online_at:new Date().toISOString()
      });
    }
  });

  realtime = db.channel('athar-messages-' + user.id);

  realtime.on('postgres_changes',{
    event:'INSERT',schema:'public',table:'messages'
  },async payload => {
    const m = payload.new;
    if (!m || (m.sender_id !== user.id && m.recipient_id !== user.id)) return;

    if (!messages.some(x => String(x.id) === String(m.id))) {
      if (active && (
        (m.sender_id === active.user_id && m.recipient_id === user.id) ||
        (m.sender_id === user.id && m.recipient_id === active.user_id)
      )) {
        messages.push(m);
        await loadReactions();
        renderMessages();
      } else if (m.sender_id !== user.id) {
        toast('وصلتك رسالة جديدة.');
      }
    }
    renderPeople();
  });

  realtime.on('postgres_changes',{
    event:'DELETE',schema:'public',table:'messages'
  },payload => {
    const id = String(payload.old?.id);
    messages = messages.filter(m => String(m.id) !== id);
    reactions = reactions.filter(r => String(r.message_id) !== id);
    renderMessages();
    renderPeople();
  });

  realtime.on('postgres_changes',{
    event:'*',schema:'public',table:'message_reactions'
  },async () => {
    if (active) await loadReactions();
  });

  realtime.subscribe();
}

/* مؤشر الكتابة */
async function startTypingChannel() {
  stopTypingChannel();
  if (!active) return;

  const ids = [user.id,active.user_id].sort();
  typingChannel = db.channel('athar-typing-' + ids.join('-'));

  typingChannel.on('broadcast',{event:'typing'},({payload}) => {
    if (payload?.user_id !== active?.user_id) return;
    $('typingLine').textContent = payload.typing
      ? `${active.display_name || active.username} يكتب الآن...`
      : '';
  });

  typingChannel.subscribe();
}

function stopTypingChannel() {
  if (typingChannel) db.removeChannel(typingChannel);
  typingChannel = null;
  $('typingLine').textContent = '';
}

async function sendTyping(typing) {
  if (!typingChannel) return;

  try {
    await typingChannel.send({
      type:'broadcast',
      event:'typing',
      payload:{user_id:user.id,typing}
    });
  } catch {}
}

/* تسجيل الخروج */
$('logout').onclick = async () => {
  try {
    await updateLastSeen();
    if (presence) await presence.untrack();
    stopTypingChannel();
    if (realtime) db.removeChannel(realtime);
    if (presence) db.removeChannel(presence);

    await db.auth.signOut();

    user = null;
    profile = null;
    active = null;
    messages = [];
    reactions = [];
    online.clear();

    showAuth();
    toast('تم تسجيل الخروج.');
  } catch(e) {
    toast(errorText(e));
  }
};

document.addEventListener('visibilitychange',() => {
  if (!document.hidden) updateLastSeen();
});

db.auth.onAuthStateChange((event,session) => {
  if (session?.user && (!user || user.id !== session.user.id)) {
    user = session.user;
    setTimeout(() => startApp(),0);
  }

  if (event === 'SIGNED_OUT') {
    user = null;
    profile = null;
    showAuth();
  }
});

(async () => {
  try {
    const {data,error} = await db.auth.getSession();
    if (error) throw error;

    if (data.session?.user) {
      user = data.session.user;
      await startApp();
    } else {
      showAuth();
    }
  } catch(e) {
    console.error(e);
    showAuth();
    toast(errorText(e));
  }
})();
})();
